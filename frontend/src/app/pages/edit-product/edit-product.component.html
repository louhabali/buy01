<div class="container mt-5">


<div class="card p-4">


<h2>
Edit Product
</h2>



<input
class="form-control mb-3"
[(ngModel)]="name"
placeholder="Name">



<input
class="form-control mb-3"
type="number"
[(ngModel)]="price"
placeholder="Price">



<input
class="form-control mb-3"
type="file"
multiple
(change)="selectImages($event)">



<button
class="btn btn-primary"
(click)="update()">

Update

</button>


</div>


</div>
