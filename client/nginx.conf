events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Optional: Redirect HTTP (8080) traffic to HTTPS (8443 or 443)
    server {
        listen 8080;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl; # Use 8443 (or 443 if running with root/sudo)
        server_name localhost;

        # Local SSL Certificates (Generated via mkcert or certbot)
        ssl_certificate     /etc/nginx/certs/localhost.pem;
        ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

        # Disable SSL verification for local upstream services using self-signed certs
        proxy_ssl_verify off;

        # 1. Frontend: Route to Angular Dev Server over HTTPS
        location / {
            proxy_pass https://localhost:4200;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 2. Auth Service Endpoints -> Spring Gateway over HTTPS
        location /auth/ {
            proxy_pass https://localhost:8089/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 3. Product Service Endpoints -> Spring Gateway over HTTPS
        location /products/ {
            proxy_pass https://localhost:8089/products/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 4. Media Service Endpoints -> Spring Gateway over HTTPS
        location /media/ {
            client_max_body_size 20M;
            proxy_pass https://localhost:8089/media/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}