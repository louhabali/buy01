<div class="min-h-screen bg-gradient-to-br from-blue-950 via-blue-900 to-blue-800 flex items-center justify-center p-6">
    <div
    *ngIf="loading"
    class="min-h-screen bg-[#001F3F] flex items-center justify-center">

    <h1 class="text-white text-3xl font-bold">
        Loading...
    </h1>

</div>


<div
    *ngIf="!loading && user"
    class="min-h-screen bg-gradient-to-br from-[#001F3F] via-[#003366] to-[#001A33]
    flex items-center justify-center p-6">


    <div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl p-10">
    <div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl p-10">

        <div class="grid md:grid-cols-3 gap-10 items-center">

            <!-- LEFT -->
            <div class="flex flex-col items-center">

                <img
                    [src]="user.avatar"
                    class="w-44 h-44 rounded-full object-cover border-4 border-blue-900 shadow-lg">

                <h1 class="mt-6 text-3xl font-bold text-blue-950">
                    {{ user.name }}
                </h1>

                <span
                    class="mt-3 px-5 py-2 rounded-full bg-blue-900 text-white font-semibold">

                    {{ user.role }}

                </span>

            </div>

            <!-- CENTER -->
            <div class="md:col-span-2">

                <h2 class="text-3xl font-bold text-blue-950 mb-8">
                    My Profile
                </h2>

                <div class="grid md:grid-cols-2 gap-6">

                    <div>
                        <label class="block text-gray-500 mb-2">
                            Username
                        </label>

                        <div class="bg-gray-100 rounded-xl px-5 py-4 font-semibold text-blue-950">
                            {{ user.name }}
                        </div>
                    </div>

                    <div>
                        <label class="block text-gray-500 mb-2">
                            Email
                        </label>

                        <div class="bg-gray-100 rounded-xl px-5 py-4 font-semibold text-blue-950">
                            {{ user.email }}
                        </div>
                    </div>

                    <div>
                        <label class="block text-gray-500 mb-2">
                            Role
                        </label>

                        <div class="bg-gray-100 rounded-xl px-5 py-4 font-semibold text-blue-950">
                            {{ user.role }}
                        </div>
                    </div>

                    <div>
                        <label class="block text-gray-500 mb-2">
                            Member Since
                        </label>

                        <div class="bg-gray-100 rounded-xl px-5 py-4 font-semibold text-blue-950">
                            {{ user.createdAt | date:'dd/MM/yyyy'}}
                        </div>
                    </div>

                </div>

                <div class="flex flex-wrap gap-4 mt-10">

                    <button
                        (click)="editProfile()"
                        class="flex-1 min-w-[180px] bg-blue-900 hover:bg-blue-800 text-white font-semibold py-3 rounded-xl transition">

                        Edit Profile

                    </button>

                    <button
                        (click)="changePassword()"
                        class="flex-1 min-w-[180px] border-2 border-blue-900 text-blue-900 hover:bg-blue-50 font-semibold py-3 rounded-xl transition">

                        Change Password

                    </button>

                    <button
                        (click)="logout()"
                        class="flex-1 min-w-[180px] bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-xl transition">

                        Logout

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
