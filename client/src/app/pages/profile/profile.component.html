<div class="min-h-screen bg-gradient-to-br from-[#001F3F] via-[#003366] to-[#001A33] flex items-center justify-center p-6">

    <!-- Loading -->
    <div *ngIf="loading" class="text-center">
        <h1 class="text-white text-3xl font-bold">
            Loading...
        </h1>
    </div>

    <!-- Profile -->
    <div *ngIf="!loading && user"
        class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl p-10">

        <div class="grid md:grid-cols-3 gap-10 items-start">

            <!-- ================= LEFT ================= -->
            <div class="flex flex-col items-center">

                <div class="relative">

                    <img
                        [src]="previewImage || '/dep.png'"
                        class="w-44 h-44 rounded-full object-cover border-4 border-blue-900 shadow-lg">

                    <label
                        *ngIf="editing"
                        class="absolute bottom-2 right-2 w-10 h-10 rounded-full bg-blue-900 text-white flex items-center justify-center cursor-pointer hover:bg-blue-800 transition">

                        📷

                        <input
                            hidden
                            type="file"
                            accept="image/*"
                            (change)="onImageSelected($event)">

                    </label>

                </div>

                <h1 class="mt-6 text-3xl font-bold text-blue-950">
                    {{ user.name }}
                </h1>

                <span
                    class="mt-3 px-5 py-2 rounded-full bg-blue-900 text-white font-semibold">

                    {{ user.role }}

                </span>

                <p
                    *ngIf="editing"
                    class="text-sm text-gray-500 mt-4 text-center">

                    Click the camera icon to change your picture.

                </p>

            </div>

            <!-- ================= RIGHT ================= -->
            <div class="md:col-span-2">

                <div class="flex justify-between items-center mb-8">

                    <h2 class="text-3xl font-bold text-blue-950">
                        My Profile
                    </h2>

                    <span
                        *ngIf="editing"
                        class="bg-green-100 text-green-700 px-4 py-2 rounded-full font-medium">

                        Editing

                    </span>

                </div>

                <div class="grid md:grid-cols-2 gap-6">

                    <!-- Username -->
                    <div>

                        <label class="block text-gray-500 mb-2">
                            Username
                        </label>

                        <div
                            *ngIf="!editing"
                            class="bg-gray-100 rounded-xl px-5 py-4 font-semibold text-blue-950">

                            {{ user.name }}

                        </div>

                        <input
                            *ngIf="editing"
                            [(ngModel)]="editedUser.name"
                            class="w-full rounded-xl border border-gray-300 px-5 py-4 focus:outline-none focus:ring-2 focus:ring-blue-900">

                    </div>

                    <!-- Email -->
                    <div>

                        <label class="block text-gray-500 mb-2">
                            Email
                        </label>

                        <div
                            *ngIf="!editing"
                            class="bg-gray-100 rounded-xl px-5 py-4 font-semibold text-blue-950">

                            {{ user.email }}

                        </div>

                        <input
                            *ngIf="editing"
                            [(ngModel)]="editedUser.email"
                            type="email"
                            class="w-full rounded-xl border border-gray-300 px-5 py-4 focus:outline-none focus:ring-2 focus:ring-blue-900">

                    </div>

                    <!-- Role -->
                    <div>

                        <label class="block text-gray-500 mb-2">
                            Role
                        </label>

                        <div class="bg-gray-100 rounded-xl px-5 py-4 font-semibold text-blue-950">

                            {{ user.role }}

                        </div>

                    </div>

                    <!-- Member Since -->
                    <div>

                        <label class="block text-gray-500 mb-2">
                            Member Since
                        </label>

                        <div class="bg-gray-100 rounded-xl px-5 py-4 font-semibold text-blue-950">

                            {{ user.createdAt | date:'dd/MM/yyyy' }}

                        </div>

                    </div>

                </div>

                <!-- ================= BUTTONS ================= -->
                <div class="flex flex-wrap gap-4 mt-10">

                    <!-- Normal Mode -->
                    <button
                        *ngIf="!editing"
                        (click)="editProfile()"
                        class="flex-1 min-w-[180px] bg-blue-900 hover:bg-blue-800 text-white font-semibold py-3 rounded-xl transition">

                        Edit Profile

                    </button>

                    <button
                        *ngIf="!editing"
                        (click)="changePassword()"
                        class="flex-1 min-w-[180px] border-2 border-blue-900 text-blue-900 hover:bg-blue-50 font-semibold py-3 rounded-xl transition">

                        Change Password

                    </button>

                    <!-- Edit Mode -->
                    <button
                        *ngIf="editing"
                        (click)="saveProfile()"
                        class="flex-1 min-w-[180px] bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl transition">

                        Save Changes

                    </button>

                    <button
                        *ngIf="editing"
                        (click)="cancelEdit()"
                        class="flex-1 min-w-[180px] border-2 border-gray-400 text-gray-700 hover:bg-gray-100 font-semibold py-3 rounded-xl transition">

                        Cancel

                    </button>

                    <!-- Logout -->
                    <button
                        (click)="logout()"
                        class="flex-1 min-w-[180px] bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-xl transition">

                        Logout

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
