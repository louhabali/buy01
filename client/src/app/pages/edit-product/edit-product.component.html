<div class="min-h-screen bg-[#0a1120] flex items-center justify-center p-6 antialiased font-sans">

  <!-- Loading Blanket -->
  <div *ngIf="loading" class="text-center animate-pulse text-white text-lg font-mono uppercase tracking-widest">
    Retrieving Item State...
  </div>

  <div *ngIf="!loading" class="w-full max-w-3xl bg-white border border-[#001830]/10 rounded-2xl shadow-[0_20px_50px_rgba(0,24,48,0.15)] overflow-hidden">
    
    <!-- Top Header -->
    <div class="bg-[#001830] p-8 flex justify-between items-center text-white border-b border-[#001830]">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Edit Product</h1>
        <p class="text-xs text-white/50 uppercase font-mono tracking-wider mt-1">ID: {{ id }}</p>
      </div>
      <a routerLink="/products" class="text-xs text-white/70 hover:text-white uppercase font-mono tracking-widest border border-white/20 px-3 py-1.5 rounded">
        Cancel
      </a>
    </div>

    <!-- Body Section -->
    <div class="p-8 sm:p-10">
      
      <div *ngIf="errorMessage" class="mb-6 bg-red-950 border border-red-800 text-red-400 text-xs font-mono uppercase px-4 py-3 rounded-lg shadow-sm">
        ⚠️ {{ errorMessage }}
      </div>

      <div class="space-y-6">

        <!-- Title -->
        <div>
          <label class="block text-[11px] font-bold tracking-widest uppercase text-gray-400 mb-2">
            Product Name
          </label>
          <input [(ngModel)]="name" type="text"
                 class="w-full text-base font-semibold text-[#001830] bg-gray-50 border border-gray-200 rounded-lg p-3.5 focus:outline-none focus:border-[#001830] transition">
        </div>

        <!-- Description -->
        <div>
          <label class="block text-[11px] font-bold tracking-widest uppercase text-gray-400 mb-2">
            Description
          </label>
          <textarea [(ngModel)]="description" rows="3"
                    class="w-full text-sm font-medium text-[#001830] bg-gray-50 border border-gray-200 rounded-lg p-3.5 focus:outline-none focus:border-[#001830] transition resize-none"></textarea>
        </div>

        <!-- Price & Quantity -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label class="block text-[11px] font-bold tracking-widest uppercase text-gray-400 mb-2">
              Price (DH)
            </label>
            <input [(ngModel)]="price" type="number" min="0"
                   class="w-full text-base font-semibold text-[#001830] bg-gray-50 border border-gray-200 rounded-lg p-3.5 focus:outline-none focus:border-[#001830] transition">
          </div>

          <div>
            <label class="block text-[11px] font-bold tracking-widest uppercase text-gray-400 mb-2">
              Quantity
            </label>
            <input [(ngModel)]="quantity" type="number" min="0"
                   class="w-full text-base font-semibold text-[#001830] bg-gray-50 border border-gray-200 rounded-lg p-3.5 focus:outline-none focus:border-[#001830] transition">
          </div>
        </div>

        <!-- Existing Images -->
        <div *ngIf="existingImages.length > 0">
          <label class="block text-[11px] font-bold tracking-widest uppercase text-gray-400 mb-2">
            Current Images
          </label>
          <div class="flex flex-wrap gap-3">
            <div *ngFor="let url of existingImages" class="w-16 h-16 rounded-lg overflow-hidden border border-[#001830]/20 shadow-sm">
              <img [src]="url" class="w-full h-full object-cover">
            </div>
          </div>
        </div>

        <!-- Upload New Replacement Images -->
        <div>
          <label class="block text-[11px] font-bold tracking-widest uppercase text-gray-400 mb-2">
            Replace / Add New Images
          </label>
          <input type="file" multiple (change)="selectImages($event)"
                 class="block w-full text-xs text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:uppercase file:bg-[#001830] file:text-white hover:file:bg-[#001830]/90 cursor-pointer">
          
          <!-- New Image Previews -->
          <div *ngIf="previews.length > 0" class="flex flex-wrap gap-3 mt-4">
            <div *ngFor="let preview of previews" class="w-16 h-16 rounded-lg overflow-hidden border border-[#001830]/20 shadow-sm">
              <img [src]="preview" class="w-full h-full object-cover">
            </div>
          </div>
        </div>

      </div>

      <!-- Footer Buttons -->
      <div class="mt-10 pt-6 border-t border-[#001830]/10 flex justify-end gap-3">
        <a routerLink="/products" 
           class="border border-gray-300 text-gray-600 font-bold text-xs uppercase tracking-widest py-3.5 px-6 rounded-lg hover:border-[#001830] transition">
          Discard
        </a>
        <button (click)="update()" [disabled]="saving"
                class="bg-[#001830] hover:bg-[#001830]/90 text-white font-bold text-xs uppercase tracking-widest py-3.5 px-8 rounded-lg transition shadow-md disabled:opacity-40">
          {{ saving ? 'Saving Changes...' : 'Update Product' }}
        </button>
      </div>

    </div>

  </div>

</div>
