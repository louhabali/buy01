<div class="min-h-screen bg-gradient-to-br from-blue-950 via-blue-900 to-blue-800 flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-10">

        <div class="text-center mb-8">

            <h1 class="text-4xl font-bold text-blue-950">
                Welcome Back
            </h1>

            <p class="text-gray-500 mt-2">
                Sign in to your Buy01 account
            </p>

        </div>

        <form
            [formGroup]="form"
            (ngSubmit)="login()"
            class="space-y-5">

            <!-- Email -->
            <div>

                <label class="block mb-2 font-semibold text-gray-700">
                    Email
                </label>

                <input
                    type="email"
                    formControlName="email"
                    placeholder="example@email.com"
                    class="w-full rounded-xl border border-gray-300 px-4 py-3
                    focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">

            </div>

            <!-- Password -->
            <div>

                <label class="block mb-2 font-semibold text-gray-700">
                    Password
                </label>

                <input
                    type="password"
                    formControlName="password"
                    placeholder="••••••••"
                    class="w-full rounded-xl border border-gray-300 px-4 py-3
                    focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">

            </div>

            <div
                *ngIf="error"
                class="bg-red-100 border border-red-300 text-red-700 rounded-xl px-4 py-3">

                {{ error }}

            </div>

            <button
                type="submit"
                class="w-full bg-blue-900 hover:bg-blue-800 transition text-white font-semibold py-3 rounded-xl">

                {{ loading ? 'Signing In...' : 'Login' }}

            </button>

        </form>

        <div class="mt-8 text-center">

            <span class="text-gray-600">
                Don't have an account?
            </span>

            <a
                routerLink="/register"
                class="ml-1 font-bold text-blue-900 hover:underline">

                Register

            </a>

        </div>

    </div>

</div>
