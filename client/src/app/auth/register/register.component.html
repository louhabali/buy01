<div class="min-h-screen bg-gradient-to-br from-blue-950 via-blue-900 to-blue-800 flex items-center justify-center p-4 overflow-y-auto">

  <div class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl p-8 lg:p-10">

    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-blue-950">
        Create Account
      </h1>

      <p class="text-gray-500 mt-2">
        Join Buy01 and start buying or selling today.
      </p>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="register()"
      class="space-y-5">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

        <div>
          <label class="block mb-2 font-semibold text-gray-700">
            Username
          </label>

          <input
            type="text"
            formControlName="username"
            placeholder="Enter your username"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
          <label class="block mb-2 font-semibold text-gray-700">
            Email
          </label>

          <input
            type="email"
            formControlName="email"
            placeholder="example@email.com"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

        <div>
          <label class="block mb-2 font-semibold text-gray-700">
            Password
          </label>

          <input
            type="password"
            formControlName="password"
            placeholder="••••••••"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
          <label class="block mb-2 font-semibold text-gray-700">
            Account Type
          </label>

          <select
            formControlName="role"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">

            <option value="CLIENT">CLIENT</option>
            <option value="SELLER">SELLER</option>

          </select>
        </div>

      </div>

      <!-- Avatar -->
<div>

    <label class="block mb-3 font-semibold text-gray-700">
        Profile Picture
        <span class="text-gray-400 font-normal">(Optional)</span>
    </label>

    <div class="flex items-center gap-6">

        <!-- Preview -->
        <div
            class="w-28 h-28 rounded-full overflow-hidden border-4 border-blue-200 shadow-lg bg-gray-100 flex items-center justify-center">

            <img
                *ngIf="avatarPreview; else defaultAvatar"
                [src]="avatarPreview"
                alt="Avatar Preview"
                class="w-full h-full object-cover">

            <ng-template #defaultAvatar>

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-12 h-12 text-gray-400"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M5.121 17.804A9.969 9.969 0 0112 15c2.21 0 4.253.716 5.879 1.926M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>

                </svg>

            </ng-template>

        </div>

        <!-- Upload Button -->
        <div>

            <label
                for="avatar"
                class="cursor-pointer inline-flex items-center gap-2 bg-blue-900 hover:bg-blue-800 text-white px-5 py-3 rounded-xl font-semibold transition">

                Pick Avatar

            </label>

            <input
                id="avatar"
                type="file"
                accept="image/*"
                (change)="onAvatarSelected($event)"
                hidden>

            <p class="text-sm text-gray-500 mt-2">
                JPG, PNG or WEBP
            </p>

        </div>

    </div>

</div>

      <div
        *ngIf="error"
        class="rounded-xl bg-red-100 border border-red-300 text-red-700 px-4 py-3">
        {{ error }}
      </div>

      <button
        type="submit"
        class="w-full bg-blue-900 hover:bg-blue-800 transition duration-300 text-white font-semibold text-lg py-3 rounded-xl">

        {{ loading ? 'Creating Account...' : 'Create Account' }}

      </button>

    </form>

    <div class="mt-6 text-center">
      <span class="text-gray-600">
        Already have an account?
      </span>

      <a
        routerLink="/login"
        class="ml-1 font-bold text-blue-900 hover:underline">
        Login
      </a>
    </div>

  </div>

</div>
