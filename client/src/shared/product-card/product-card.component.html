<div (click)="navigateToDetails()" 
     class="bg-white/5 border border-white/10 hover:border-white/20 rounded-xl p-4 transition-all duration-200 cursor-pointer flex flex-col justify-between h-full group">
  
  <div>
    <!-- Image Preview -->
    <div class="aspect-square w-full rounded-lg bg-black/40 overflow-hidden mb-4 border border-white/5 relative">
      <img [src]="primaryImage" 
           [alt]="product.name || 'Product Image'"
           (error)="onImageError($event)"
           class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
    </div>

    <!-- Product Details -->
    <h3 class="text-white font-bold text-lg tracking-wide truncate">
      {{ product.name || 'Untitled Product' }}
    </h3>
    <p class="text-gray-400 text-xs mt-1 min-h-[32px]">
      {{ truncatedDescription || 'No description provided.' }}
    </p>
  </div>

  <div class="mt-4 pt-3 border-t border-white/10 flex items-center justify-between">
    <div>
      <span class="text-xs text-gray-400 block font-mono uppercase">Price</span>
      <span class="text-white font-black text-lg">${{ product.price || 0 }}</span>
    </div>

    <!-- Owner Actions -->

  </div>

</div>
