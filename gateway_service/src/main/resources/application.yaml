spring:
  application:
    name: gateway_service
  server:
    port: 8080
  cloud:
    gateway:
      routes:
        - id: user_service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: product_service
          uri: http://localhost:8082
          predicates:
            - Path=/products/**
            
        - id: media_service
          uri: http://localhost:8083
          predicates:
            - Path=/media/**
