server:
  port: 8089
  ssl:
    enabled: true
    key-store: classpath:gateway.p12
    key-store-password: 123456
    key-store-type: PKCS12
    key-alias: gateway

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/products/**

        - id: media-service
          uri: http://localhost:8083
          predicates:
            - Path=/media/**
        - id: media_uploads
          uri: http://localhost:8083
          predicates:
            - Path=/uploads/**
logging:
  level:
    org.springframework.cloud.gateway: TRACE