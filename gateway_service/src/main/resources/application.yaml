server:
  port: 8089
spring:
  application:
    name: gateway_service
  cloud:
    gateway:
      routes:
        - id: user_service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: product_service
          uri: http://localhost:8082
          predicates:
            - Path=/products/**
              
        - id: media_service
          uri: http://localhost:8083
          predicates:
            - Path=/media/**
