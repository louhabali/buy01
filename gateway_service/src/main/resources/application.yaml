server:
  port: 8089
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/auth/**

        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/products/**

        - id: media-service
          uri: http://media-service:8083
          predicates:
            - Path=/media/**
