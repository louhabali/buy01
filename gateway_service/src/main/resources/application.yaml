server:
  port: 8089
  ssl:
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: 1

spring:
  application:
    name: gateway-service

  codec:
    max-in-memory-size: 20MB

  cloud:
    gateway:
      # Fix: HttpClient configuration for SSL bypass in Reactor Netty
      httpclient:
        ssl:
          useInsecureTrustManager: true
          handshake-timeout: 10000ms
      
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "https://localhost:8443"
              - "https://localhost:4200"
              - "http://localhost:8080"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/products/**

        - id: media-service
          uri: http://localhost:8083
          predicates:
            - Path=/media/**

        - id: media_uploads
          uri: http://localhost:8083
          predicates:
            - Path=/uploads/**

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG